[tox]
envlist =
    py{310,311,312}-dj42
    py{310,311,312}-dj50
    py{310,311,312,313}-dj51
    py{310,311,312,313}-dj52
    py{312,313}-dj52-nested

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
DJANGO =
    4.2: dj42
    5.0: dj50
    5.1: dj51
    5.2: dj52

[testenv]
commands =
    pytest {posargs}
passenv =
    DATABASE_URL
setenv =
    nested: DJANGO_SETTINGS_MODULE=generic_plus.tests.settings_nested
deps =
    lxml
    dj-database-url
    dj42: Django>=4.2,<4.3
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1a1,<5.2
    dj52: Django>=5.2,<5.3
    nested: django-nested-admin
    pytest
    pytest-django
